# tmux.conf --- imoogi 기본 tmux 설정
#
# 목표는 딱 하나 — "기본기만 제대로". 플러그인 관리자(tpm)도, 외부 테마도
# 쓰지 않는다. 이 파일 하나와 tmux 본체만 있으면 어디서든 같은 화면이 나온다.
# 폐쇄망 머신에 그대로 들고 들어갈 수 있어야 하기 때문이다.
#
#   설치:  make tmux-install       (~/.tmux.conf 을 이 파일로 향하게 만든다)
#   적용:  prefix + r              (설정만 다시 읽는다 — 세션은 그대로)
#   개인 취향: ~/.tmux.local.conf  (이 파일 맨 아래에서 마지막에 읽는다)
#
# [HARD] prefix 는 기본값 C-b 그대로 둔다. 바꾸면 이 설정을 처음 보는 사람이
# 아무 키도 못 누르고, 문서·검색 결과와도 어긋난다. 바꾸고 싶으면 개인 파일
# (~/.tmux.local.conf) 에 `set -g prefix C-a` 처럼 적는다.

## ---------------------------------------------------------------- 색과 터미널

# tmux 안쪽 TERM. 256색 + 이탤릭을 제대로 알리는 표준값이다.
set -g default-terminal "tmux-256color"

# 바깥 터미널이 24비트 색(RGB)을 낼 수 있다고 tmux 에게 알려준다.
# terminfo 의 xterm-256color 항목에는 RGB 표시가 없어서(실측) 이 줄이 없으면
# doom-one 같은 hex 색 테마가 256색으로 뭉개진다.
#   clipboard  OSC52 로 시스템 클립보드 쓰기 (ssh 너머에서도 복사됨)
#   ccolour/cstyle  프로그램이 커서 색·모양을 바꾸는 것을 통과시킴
#   focus      포커스 이동 이벤트 통과 (Emacs 가 창 전환을 알아챈다)
#   usstyle    밑줄 색/모양 (LSP 진단의 물결 밑줄)
# 주의: 기능끼리는 콜론(:)으로 잇는다. 쉼표를 쓰면 tmux 가 그것을 배열 항목
# 구분자로 읽어서, 기능이 아니라 "이름 없는 터미널 종류"로 들어간다(실측).
set -as terminal-features ",*256col*:RGB:clipboard:ccolour:cstyle:focus:usstyle:title"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:ccolour:cstyle:focus:usstyle:title"
set -as terminal-features ",alacritty:RGB:clipboard:ccolour:cstyle:focus:usstyle:title"

## ---------------------------------------------------------------- 기본 동작

# 마우스 — 클릭으로 pane/window 이동, 경계선 끌어서 크기 조절, 휠로 스크롤.
# 이 한 줄이 "마우스로 클릭해서 옮겨 가기"의 전부다.
set -g mouse on

# 스크롤백. 기본 2000 줄은 빌드 로그 한 번에 날아간다.
set -g history-limit 50000

# ESC 를 눌렀을 때 뒤에 오는 키를 기다리는 시간(ms).
# 기본 500ms 는 Emacs/vim 에서 ESC 반응이 굼떠 보이는 원인이다.
# 0 대신 10 을 쓰는 이유: 느린 ssh 에서 방향키(ESC 로 시작)가 깨지지 않도록.
set -sg escape-time 10

# 포커스 이벤트를 안쪽 프로그램에 전달한다. Emacs 가 다른 pane 으로 갔다는
# 걸 알아야 자동 저장·커서 흐리게 같은 동작이 제대로 돈다.
set -g focus-events on

# 복사한 내용을 시스템 클립보드로 보낸다 (OSC52).
set -g set-clipboard on

# 창/pane 번호를 1부터 센다. 키보드 숫자열 배치와 맞다.
set -g base-index 1
setw -g pane-base-index 1

# 가운데 창을 닫아도 번호가 이어지게 다시 매긴다.
set -g renumber-windows on

# 복사 모드와 명령줄 키 배치. 이 저장소는 Emacs 설정이라 emacs 로 맞춘다.
setw -g mode-keys emacs
set -g status-keys emacs

# 소리 알림은 끈다.
set -g bell-action none

# (선택) 다른 창에서 출력이 생겼을 때 알려주기. 아래 세 줄은 한 묶음이다 —
# monitor-activity 를 켜지 않으면 visual-activity 도 강조색도 아무 일을 하지
# 않는다(실측: 켜기 전에는 알림 자체가 생기지 않는다).
# 창을 여럿 띄우고 로그가 계속 도는 환경에서는 표시가 쉴 새 없이 깜빡이므로
# 기본은 꺼 둔다. 필요하면 앞의 두 줄 주석을 푼다.
# setw -g monitor-activity on
# set -g visual-activity on
set -g window-status-activity-style "fg=#c678dd"

## ---------------------------------------------------------------- 커서

# 커서 색. 모양(블록/막대)은 안쪽 프로그램이 정하도록 두고 색만 밝게 잡는다.
# 모양까지 고정하고 싶으면 아래 cursor-style 주석을 푼다 — 다만 그러면
# Emacs 가 상태에 따라 커서 모양을 바꾸는 것도 함께 막힌다.
# 주의: cursor-colour/cursor-style 은 pane 옵션이라 -p 가 필요하다. `set -g` 로
# 쓰면 tmux 가 오류도 내지 않고 조용히 무시한다(실측: rc=0, 값 안 들어감).
set -gp cursor-colour "#51afef"
# set -gp cursor-style blinking-bar

## ---------------------------------------------------------------- pane 경계

# 비활성 경계는 어둡게, 활성 경계는 밝은 파랑 + 굵은 선.
set -g pane-border-style "fg=#3f444a"
set -g pane-active-border-style "fg=#51afef"
set -g pane-border-lines heavy

# pane 이 둘뿐일 때도 어느 쪽이 활성인지 보이게 화살표 표시를 켠다.
set -g pane-border-indicators both

# 각 pane 위에 얇은 제목줄. 활성 pane 은 반전시켜 한눈에 들어오게 한다.
# 내용: pane 번호 + 지금 돌고 있는 명령 + 작업 디렉터리 이름.
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=#51afef]#[fg=#23272e]#[bold],#[fg=#5B6268]} #P #{pane_current_command} · #{b:pane_current_path} #[default]"

# prefix + q 로 pane 번호를 띄울 때 머무는 시간(ms). 기본 1초는 짧다.
set -g display-panes-time 2000
set -g display-time 2000

# (선택) 비활성 pane 의 글자까지 흐리게 만들고 싶다면 아래 두 줄을 푼다.
# 활성 pane 이 확 도드라지는 대신, 옆 pane 의 로그는 읽기 힘들어진다.
# set -g window-style "fg=#6a7382"
# set -g window-active-style "fg=default"

## ---------------------------------------------------------------- 상태 바

# 색은 Emacs 쪽 doom-one 테마와 같은 팔레트를 쓴다.
#   바탕 #23272e · 글자 #bbc2cf · 강조 #51afef · 흐림 #5B6268 · 보라 #c678dd
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#23272e,fg=#bbc2cf"

# 왼쪽: 세션 이름.
set -g status-left-length 40
set -g status-left "#[bg=#51afef,fg=#23272e,bold] #S #[default] "

# 오른쪽: prefix 를 눌러 대기 중이면 보라색 표시가 뜬다 — 키가 먹었는지
# 헷갈릴 일이 없어진다. 그 뒤로 호스트 이름과 시각.
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[bg=#c678dd]#[fg=#23272e]#[bold] PREFIX #[default] ,}#[fg=#5B6268]#h  #[fg=#bbc2cf]%H:%M "

# 창 목록: 현재 창만 강조.
set -g window-status-separator ""
set -g window-status-format "#[fg=#5B6268] #I #W "
set -g window-status-current-format "#[bg=#51afef,fg=#23272e,bold] #I #W "

## ---------------------------------------------------------------- 키 배치

# 설정 다시 읽기. 세션을 죽이지 않고 이 파일만 다시 적용한다.
bind r source-file ~/.tmux.conf \; display "tmux 설정을 다시 읽었습니다"

# 나누기 — 기본 " 와 % 는 무슨 방향인지 안 보인다. | 와 - 를 같이 둔다.
# 넷 다 지금 pane 의 디렉터리를 그대로 물려받는다.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# pane 이동 — 방향키. prefix 를 누른 채 반복해서 누를 수 있다(-r).
bind -r Left  select-pane -L
bind -r Down  select-pane -D
bind -r Up    select-pane -U
bind -r Right select-pane -R

# pane 크기 조절 — Shift + 방향키.
bind -r S-Left  resize-pane -L 5
bind -r S-Down  resize-pane -D 5
bind -r S-Up    resize-pane -U 5
bind -r S-Right resize-pane -R 5

## ---------------------------------------------------------------- 마우스 스크롤과 복사

# 휠 한 칸에 두 줄. 기본은 다섯 줄이라 훅훅 건너뛴다.
# 더 부드럽게 하고 싶으면 -N1, 빠르게 넘기려면 -N5.
bind -T copy-mode WheelUpPane   send -N2 -X scroll-up
bind -T copy-mode WheelDownPane send -N2 -X scroll-down

# 마우스로 드래그해 놓으면 복사되고 복사 모드에서 바로 빠져나온다.
# set-clipboard on 만으로도 대부분 되지만, OSC52 를 막아 둔 터미널에서는
# 아래의 pbcopy/xclip 경유가 확실하다.
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"'
if-shell 'command -v xclip >/dev/null 2>&1' \
  'bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i"'

# 가운데 클릭으로 붙여넣기.
bind -T root MouseDown2Pane paste-buffer -p

## ---------------------------------------------------------------- 개인 설정

# 여기까지가 저장소가 주는 기본값이다. 이 아래는 이 머신에서만 쓰는 취향.
# 없으면 조용히 넘어간다(-q). 같은 옵션이면 나중에 읽힌 이쪽이 이긴다.
source-file -q ~/.tmux.local.conf

# tmux.conf ends here
